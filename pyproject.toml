[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["vendor/**", ".venv/**"]

[project.scripts]
kanka-wiki-updater = "kanka_wiki_updater.cli.__main__:main"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Side-effect imports for test mocking (same pattern as review_web.py)
"kanka_wiki_updater/sync/sync_engine.py" = ["F401"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
