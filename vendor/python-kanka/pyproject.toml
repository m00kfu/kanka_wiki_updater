[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-kanka"
version = "2.6.2"
description = "Python client for the Kanka API"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Erv Walter", email = "erv@ewal.net"}
]
keywords = ["kanka", "api", "rpg", "worldbuilding", "tabletop", "ttrpg", "dnd", "pathfinder", "campaign"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Games/Entertainment :: Role-Playing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "requests==2.34.2",
    "requests-toolbelt==1.0.0",
    "pydantic==2.13.4",
]

[project.urls]
Homepage = "https://github.com/ervwalter/python-kanka"
Documentation = "https://python-kanka.ewal.dev/"
Repository = "https://github.com/ervwalter/python-kanka"
Issues = "https://github.com/ervwalter/python-kanka/issues"

[dependency-groups]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.6",
]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "mypy==2.1.0",
    "black==26.5.1",
    "isort==8.0.1",
    "ruff==0.15.20",
    "types-requests",
    "bump2version==1.0.1",
    "build==1.5.0",
    "twine==6.2.0",
    "pre-commit==4.6.0",
    "python-dotenv==1.2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kanka"]
